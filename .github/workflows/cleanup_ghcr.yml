name: Clean up old Docker images

# Keeps the 10 most recent tagged images on ghcr.io. The images are multi-arch, so the per-platform
# manifests show up as untagged versions; this action deletes them only together with their tag.

permissions:
  packages: write

on:
  workflow_run:
    workflows: ['Publish Chatwoot docker images to GitHub']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only log what would be deleted'
        type: boolean
        default: true

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: chatwoot
          keep-n-tagged: 10
          exclude-tags: latest
          delete-untagged: true
          delete-partial-images: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
